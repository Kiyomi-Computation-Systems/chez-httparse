name: CI

# macOS is verified locally on the maintainer's arm64 laptop, not here: a hosted
# macOS runner bills at ten times the Linux rate, and an arm64 cell there
# would record a brew-installed Chez rather than exercise the pinned floor.
# CI therefore covers the Linux amd64 cell and the no-Scheme build layer.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-amd64:
    runs-on: ubuntu-latest       # x86-64 (amd64)
    env:
      HTTPARSE_EXPECT_OS: linux
      HTTPARSE_EXPECT_ARCH: amd64
      CHEZ_VERSION: "10.4.1"
    steps:
      # The generator pinned at vendor/byte-machine is a private repository,
      # and the job's own token reads only this one. The submodule is cloned
      # below with this secret, which the owner adds; without it, every run
      # stops here, by name.
      - name: Require the submodule read token
        env:
          SUBMODULES_READ_TOKEN: ${{ secrets.SUBMODULES_READ_TOKEN }}
        run: |
          if [ -z "${SUBMODULES_READ_TOKEN}" ]; then
            echo "::error::The Actions secret SUBMODULES_READ_TOKEN is not set: a token with Contents read-only on the repository .gitmodules names for vendor/byte-machine."
            exit 1
          fi

      # This repository alone, with the job's own token; the next step clones
      # the submodule.
      - uses: actions/checkout@v4

      # Needs only make and a shell, so it runs before anything is built:
      # every target has a `make help` line, and CONTRIBUTING.md and the
      # pull-request template quote only targets that exist.
      - name: Check make help and the targets the contributor docs quote
        run: make check-help

      # vendor/byte-machine at the commit the gitlink pins. The rewrite sends
      # only the org's URLs through the read token, and it lives in this step's
      # environment, not a config file: git hands GIT_CONFIG_* to the
      # submodule's clone, no file holds the token, and no later step sees it.
      # Cloned before Chez is built, so a token that cannot read the submodule
      # fails in seconds rather than after minutes.
      - name: Init submodules
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ secrets.SUBMODULES_READ_TOKEN }}@github.com/Kiyomi-Computation-Systems/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/Kiyomi-Computation-Systems/"
        run: git submodule update --init

      # Building Chez from source is minutes; every other step in this job is
      # seconds. The install prefix is under $HOME rather than /usr/local so the
      # cache can be restored without root, and it is an absolute path that is
      # identical on every hosted runner because the binary resolves its boot
      # files by compiled-in path -- a prefix restored elsewhere would not run.
      #
      # The key pins the version because the prefix holds a version-stamped boot
      # directory (lib/csv$CHEZ_VERSION): a bumped CHEZ_VERSION must miss the
      # cache rather than merge into an existing prefix. No restore-keys, for
      # the same reason -- a partial match here would be a wrong Chez, not a
      # warm start.
      - name: Restore cached Chez Scheme
        id: chez-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/chez
          key: chez-${{ runner.os }}-${{ runner.arch }}-${{ env.CHEZ_VERSION }}-threads

      - name: Build and install Chez Scheme from source (>= floor)
        if: steps.chez-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libncurses-dev uuid-dev git
          git clone --depth 1 --branch "v${CHEZ_VERSION}" \
            https://github.com/cisco/ChezScheme.git "${RUNNER_TEMP}/ChezScheme"
          cd "${RUNNER_TEMP}/ChezScheme"
          ./configure --threads --installprefix="${HOME}/.local/chez"
          make -j"$(nproc)"
          make install

      # A restored prefix carries the binary and its boot files but nothing from
      # apt, and the cache-hit path never runs the install above. These are the
      # shared libraries the built `scheme` links against; they are present on
      # the hosted image today, so this is a cheap guard against an image that
      # drops one, not a known gap.
      - name: Install Chez runtime libraries
        if: steps.chez-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libncurses6 libuuid1

      - name: Put Chez on PATH
        run: echo "${HOME}/.local/chez/bin" >> "${GITHUB_PATH}"

      # Runs on both paths: on a cache hit this is what proves the restored
      # prefix is a working runtime before anything downstream depends on it,
      # and on a miss it is the gate the save below waits for. CMake's version
      # is recorded beside it: a script run with `cmake -P` behaves by that
      # version's policy defaults, and the image chooses it, not this file.
      - name: Record the runtime identity
        run: |
          scheme --version
          echo '(display (machine-type))(newline)' | scheme -q
          cmake --version | head -1

      # Saved here rather than by the cache action's own post-step, which would
      # also run after a failed build and could publish a half-installed prefix
      # under the key -- poisoning every later run until the version changes.
      # Reaching this step means the prefix above answered as a working Chez.
      - name: Cache the Chez build
        if: steps.chez-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/chez
          key: ${{ steps.chez-cache.outputs.cache-primary-key }}

      - name: Configure and build
        run: |
          cmake --preset dev
          cmake --build --preset dev
      - name: Test (pr, then full)
        run: |
          ctest --preset pr --output-on-failure
          ctest --preset release --output-on-failure
      - name: Build-layer specs without a Scheme runtime
        run: |
          cmake --preset no-scheme
          ctest --preset no-scheme --output-on-failure
